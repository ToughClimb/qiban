name: Windows desktop verification
on:
  push:
    branches: [feat/qiban-mvp]
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Connection setup regressions
        run: node tests/connection-panel-smoke.mjs
        env:
          CHROMIUM_PATH: C:\Program Files\Google\Chrome\Application\chrome.exe
      - run: npm run desktop:make
      - name: Native production HTTPS reachability (unpaid)
        run: node --import tsx tests/native-provider-reachability.ts
        timeout-minutes: 1
      - name: Installer lifecycle with synthetic data
        run: node tests/installer-smoke.mjs
        timeout-minutes: 6
      - name: Smoke test packaged application
        shell: pwsh
        run: |
          $env:QIBAN_PACKAGED_EXE = (Resolve-Path 'out/Qiban-win32-x64/Qiban.exe').Path
          npm run test:desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Installer hashes and sizes
        shell: pwsh
        run: |
          Get-ChildItem out/make -Recurse -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            $line = "- $($_.Name): $($_.Length) bytes; SHA256 $hash"
            Write-Output $line
            $line >> $env:GITHUB_STEP_SUMMARY
          }
          'No installer upload, Release publication, or deployment was performed.' >> $env:GITHUB_STEP_SUMMARY
